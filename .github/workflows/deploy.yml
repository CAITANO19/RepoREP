name: Deploy Automático na VM Local

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar site dentro da VM
        run: |
          sudo rm -rf /vagrant/site/*
          sudo cp -r site/* /vagrant/site/
          sudo systemctl reload nginx
